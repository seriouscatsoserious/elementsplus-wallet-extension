[package]
name = "elementsplus-preconfer-signer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Fail-closed fixed-session Elements+ preconfirmation signer"
default-run = "elementsplus-preconfer-signer"

[dependencies]
elementsplus-preconf = { path = "../../vendor/elementsplus-preconf", features = ["relay"] }
futures-util = { version = "=0.3.31", features = ["sink"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }

[lints.rust]
unsafe_code = "forbid"
