[package]
name = "instant-watchtower"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
resolver = "3"
publish = false
license = "MIT"
description = "Instant watchtower: detects equivocating Instant operators and slashes their pooled bonds for the reporter reward"
default-run = "instant-watchtower"

[dependencies]
elementsplus-instant = { path = "../../rust/instant" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "=0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
