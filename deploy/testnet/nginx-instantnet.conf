limit_req_zone $binary_remote_addr zone=instantnet:10m rate=20r/s;

# Elements+ public testnet. Separate server block and certificate; does not
# touch other sites on this host.
server {
    listen 80;
    listen [::]:80;
    server_name elementsplus-135-181-240-16.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name elementsplus-135-181-240-16.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/elementsplus-135-181-240-16.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elementsplus-135-181-240-16.sslip.io/privkey.pem;
    client_max_body_size 1m;
    limit_req zone=instantnet burst=60 nodelay;

    # Esplora-compatible chain API: https://HOST/esplora/api/...
    location /esplora/ { proxy_pass http://127.0.0.1:43299/; proxy_set_header Host $host; }
    # Faucet page + POST: https://HOST/faucet/
    location /faucet/ {
        proxy_pass http://127.0.0.1:43300/;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # DEX server: /api/..., /llms.txt
    location /api/      { proxy_pass http://127.0.0.1:8890/api/; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /llms.txt { proxy_pass http://127.0.0.1:8890/llms.txt; }
    location = / { return 302 https://seriouscatsoserious.github.io/elementsplus-demo/testnet/; }
}
