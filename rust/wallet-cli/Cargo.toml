[package]
name = "elementsplus-wallet-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "epw: headless, agent-friendly ECX Alpha wallet (CLI + MCP server)"
publish = false

[[bin]]
name = "epw"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.100"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bech32 = "=0.11.0"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "=4.5.54", features = ["derive", "env"] }
elements = { version = "=0.25.3", features = ["serde"] }
elementsplus-wallet-core = { path = "../wallet-core", features = ["regtest"] }
getrandom = "=0.2.17"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "=7.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.8.23"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.24.0"

[patch.crates-io]
lwk_common = { git = "https://github.com/blockstream/lwk.git", rev = "55671e82c0cc713ece341f74704ff39255c633ec" }
